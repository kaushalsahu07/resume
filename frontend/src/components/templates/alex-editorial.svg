<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
        <rect width="100%" height="100%" fill="#faf9f7"/>
        <!-- Header -->
        <text x="200" y="50" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#1c1c1c" text-anchor="middle">A L E X &#160; D O E</text>
        <line x1="40" y1="70" x2="360" y2="70" stroke="#1c1c1c" stroke-width="2"/>
        <line x1="40" y1="74" x2="360" y2="74" stroke="#1c1c1c" stroke-width="0.5"/>
        <!-- Two Column Layout -->
        <!-- Left Column -->
        <rect x="40" y="90" width="80" height="8" fill="#1c1c1c"/>
        <rect x="40" y="110" width="100" height="4" fill="#a0a0a0"/>
        <rect x="40" y="120" width="90" height="4" fill="#a0a0a0"/>
        <rect x="40" y="130" width="95" height="4" fill="#a0a0a0"/>
        <rect x="40" y="150" width="60" height="8" fill="#1c1c1c"/>
        <rect x="40" y="170" width="100" height="4" fill="#a0a0a0"/>
        <rect x="40" y="180" width="80" height="4" fill="#a0a0a0"/>
        <!-- Right Column -->
        <rect x="160" y="90" width="120" height="8" fill="#1c1c1c"/>
        <rect x="160" y="110" width="200" height="4" fill="#666"/>
        <rect x="160" y="120" width="180" height="4" fill="#666"/>
        <rect x="160" y="130" width="190" height="4" fill="#666"/>
        <rect x="160" y="150" width="200" height="4" fill="#666"/>
        
        <rect x="160" y="180" width="120" height="8" fill="#1c1c1c"/>
        <rect x="160" y="200" width="200" height="4" fill="#666"/>
        <rect x="160" y="210" width="180" height="4" fill="#666"/>
        <rect x="160" y="220" width="190" height="4" fill="#666"/>
    </svg>