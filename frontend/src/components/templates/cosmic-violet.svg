<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
        <defs>
            <linearGradient id="cosmic-bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#0f172a"/>
                <stop offset="50%" stop-color="#2e1065"/>
                <stop offset="100%" stop-color="#0f172a"/>
            </linearGradient>
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="5" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
        </defs>
        <rect width="100%" height="100%" fill="url(#cosmic-bg)"/>
        <!-- Orbs -->
        <circle cx="80" cy="80" r="40" fill="#a855f7" opacity="0.3" filter="url(#glow)"/>
        <circle cx="320" cy="220" r="60" fill="#8b5cf6" opacity="0.2" filter="url(#glow)"/>
        <!-- Card -->
        <rect x="40" y="40" width="320" height="220" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
        <text x="200" y="90" font-family="sans-serif" font-size="24" font-weight="bold" fill="#e9d5ff" text-anchor="middle" filter="url(#glow)">COSMIC VIOLET</text>
        <rect x="150" y="110" width="100" height="4" fill="#a855f7" rx="2" filter="url(#glow)"/>
        
        <rect x="60" y="140" width="280" height="6" fill="#cbd5e1" opacity="0.6" rx="3"/>
        <rect x="60" y="160" width="260" height="6" fill="#cbd5e1" opacity="0.6" rx="3"/>
        <rect x="60" y="180" width="270" height="6" fill="#cbd5e1" opacity="0.6" rx="3"/>
        
        <rect x="60" y="210" width="60" height="20" rx="10" fill="#a855f7" opacity="0.4"/>
        <rect x="130" y="210" width="50" height="20" rx="10" fill="#8b5cf6" opacity="0.4"/>
        <rect x="190" y="210" width="70" height="20" rx="10" fill="#6d28d9" opacity="0.4"/>
    </svg>