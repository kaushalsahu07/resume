<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
        <rect width="100%" height="100%" fill="#ffffff"/>
        <!-- Clean, very spaced out layout -->
        <text x="50" y="60" font-family="sans-serif" font-size="24" font-weight="300" fill="#171717">Minimalist</text>
        <rect x="50" y="80" width="150" height="4" fill="#d4d4d4"/>
        
        <rect x="50" y="130" width="80" height="8" fill="#404040"/>
        <rect x="50" y="150" width="300" height="6" fill="#a3a3a3"/>
        <rect x="50" y="165" width="280" height="6" fill="#a3a3a3"/>
        <rect x="50" y="180" width="290" height="6" fill="#a3a3a3"/>
        
        <rect x="50" y="220" width="80" height="8" fill="#404040"/>
        <rect x="50" y="240" width="60" height="20" rx="10" fill="#f5f5f5" stroke="#e5e5e5"/>
        <rect x="120" y="240" width="80" height="20" rx="10" fill="#f5f5f5" stroke="#e5e5e5"/>
        <rect x="210" y="240" width="50" height="20" rx="10" fill="#f5f5f5" stroke="#e5e5e5"/>
    </svg>