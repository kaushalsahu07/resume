<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
        <rect width="100%" height="100%" fill="#fdfbf7"/>
        <text x="200" y="50" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#064e3b" text-anchor="middle">EMERALD</text>
        <line x1="160" y1="65" x2="240" y2="65" stroke="#064e3b" stroke-width="1"/>
        
        <!-- Big text / quote -->
        <rect x="60" y="90" width="280" height="12" fill="#064e3b"/>
        <rect x="60" y="115" width="250" height="12" fill="#064e3b"/>
        <rect x="60" y="140" width="180" height="12" fill="#064e3b"/>
        
        <!-- Divider -->
        <line x1="60" y1="180" x2="340" y2="180" stroke="#d1fae5" stroke-width="2"/>
        
        <!-- Two small columns -->
        <rect x="60" y="200" width="130" height="5" fill="#64748b"/>
        <rect x="60" y="215" width="120" height="5" fill="#64748b"/>
        <rect x="60" y="230" width="125" height="5" fill="#64748b"/>
        
        <rect x="210" y="200" width="130" height="5" fill="#64748b"/>
        <rect x="210" y="215" width="120" height="5" fill="#64748b"/>
        <rect x="210" y="230" width="125" height="5" fill="#64748b"/>
    </svg>